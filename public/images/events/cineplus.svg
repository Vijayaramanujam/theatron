<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#f59e0b"/>
  <circle cx="400" cy="250" r="220" fill="#fef3c7" opacity="0.6"/>
  <!-- Cinema Camera -->
  <rect x="340" y="190" width="220" height="150" rx="16" fill="#27272a" stroke="#09090b" stroke-width="10"/>
  <!-- Film Reels -->
  <circle cx="390" cy="140" r="55" fill="#18181b" stroke="#09090b" stroke-width="8"/>
  <circle cx="390" cy="140" r="20" fill="#e4e4e7"/>
  <circle cx="490" cy="140" r="55" fill="#18181b" stroke="#09090b" stroke-width="8"/>
  <circle cx="490" cy="140" r="20" fill="#e4e4e7"/>
  <!-- Lens Box & Hood -->
  <polygon points="560,230 680,170 680,360 560,300" fill="#18181b" stroke="#09090b" stroke-width="10"/>
  <!-- Tripod Legs -->
  <path d="M400 340 L300 480 M450 340 L450 480 M500 340 L600 480" stroke="#09090b" stroke-width="14" stroke-linecap="round"/>
  
  <text x="400" y="470" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="32" fill="#09090b" text-anchor="middle" letter-spacing="8">CINEPLUS</text>
</svg>
