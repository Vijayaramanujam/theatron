  <path d="M 400 240 C 400 180, 480 180, 480 240 C 480 310, 400 310, 400 240 Z" fill="#93c5fd" stroke="#000" stroke-width="6"/>
  <circle cx="425" cy="225" r="10" fill="#000"/>
