  <polygon points="0,0 800,0 700,500 100,500" fill="#7f1d1d" opacity="0.4"/>
  <polygon points="400,0 150,500 650,500" fill="#fbbf24" opacity="0.25"/>
  <!-- Drama Masks -->
  <!-- Comedy Mask -->
  <path d="M 330 200 C 330 140, 410 140, 410 200 C 410 270, 330 270, 330 200 Z" fill="#fef08a" stroke="#000" stroke-width="6"/>
  <circle cx="355" cy="185" r="10" fill="#000"/>
  <circle cx="385" cy="185" r="10" fill="#000"/>
