<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#f8fafc"/>
  <!-- Canvas Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  </pattern>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Photoshop & Illustrator Badges -->
  <rect x="520" y="240" width="60" height="60" rx="12" fill="#001e36"/>
  <text x="550" y="280" font-family="sans-serif" font-weight="bold" font-size="32" fill="#31a8ff" text-anchor="middle">Ps</text>
  <rect x="595" y="240" width="60" height="60" rx="12" fill="#330000"/>
  <text x="625" y="280" font-family="sans-serif" font-weight="bold" font-size="32" fill="#ff9a00" text-anchor="middle">Ai</text>

  <!-- Giant Graphics Grid Title -->
  <text x="400" y="160" font-family="'Impact', 'Space Grotesk', sans-serif" font-weight="900" font-size="90" fill="#fbbf24" stroke="#0f172a" stroke-width="6" text-anchor="middle">GRAPHICS</text>
  <text x="400" y="240" font-family="'Impact', 'Space Grotesk', sans-serif" font-weight="900" font-size="80" fill="#1e293b" stroke="#0f172a" stroke-width="4" text-anchor="middle" letter-spacing="8">GRID</text>
  
  <!-- Creative Doodles -->
  <path d="M120 100 L180 160 M180 100 L120 160" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <circle cx="220" cy="350" r="30" fill="none" stroke="#3b82f6" stroke-width="8"/>
  <polygon points="680,100 720,160 640,160" fill="#10b981"/>
  
  <text x="400" y="440" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#64748b" text-anchor="middle" letter-spacing="6">DESIGN IS THINKING MADE VISUAL</text>
</svg>
