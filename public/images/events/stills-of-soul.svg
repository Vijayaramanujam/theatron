<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#b91c1c"/>
  <path d="M0 0 L800 500 M800 0 L0 500" stroke="#991b1b" stroke-width="40" opacity="0.3"/>
  <!-- Camera Strap -->
  <path d="M260 0 C 260 180, 290 220, 310 240 M540 0 C 540 180, 510 220, 490 240" stroke="#18181b" stroke-width="24" fill="none" stroke-linecap="round"/>
  <!-- Camera Body -->
  <rect x="250" y="220" width="300" height="190" rx="16" fill="#f4f4f5" stroke="#18181b" stroke-width="10"/>
  <rect x="250" y="260" width="300" height="150" fill="#27272a"/>
  <!-- Lens -->
  <circle cx="400" cy="330" r="70" fill="#18181b" stroke="#e4e4e7" stroke-width="8"/>
  <circle cx="400" cy="330" r="48" fill="#09090b"/>
  <circle cx="420" cy="310" r="12" fill="#ffffff" opacity="0.6"/>
  <!-- Flash & Dial -->
  <rect x="280" y="200" width="40" height="20" fill="#e4e4e7" stroke="#18181b" stroke-width="6"/>
  <circle cx="470" cy="205" r="14" fill="#e4e4e7" stroke="#18181b" stroke-width="6"/>
  <text x="400" y="470" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="8">STILLS OF SOUL</text>
</svg>
