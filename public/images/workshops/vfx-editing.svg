<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#311042"/>
  <!-- Video Editing Interface -->
  <rect x="120" y="80" width="560" height="340" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="6"/>
  <!-- Top Bar -->
  <rect x="120" y="80" width="560" height="40" fill="#1e293b"/>
  <circle cx="150" cy="100" r="6" fill="#ef4444"/>
  <circle cx="170" cy="100" r="6" fill="#f59e0b"/>
  <circle cx="190" cy="100" r="6" fill="#10b981"/>
  <!-- Preview Monitor -->
  <rect x="150" y="140" width="240" height="150" fill="#1e1b4b" rx="6"/>
  <polygon points="250,195 290,215 250,235" fill="#a855f7"/>
  <!-- Timeline tracks -->
  <rect x="410" y="140" width="240" height="30" fill="#a855f7" rx="4"/>
  <rect x="410" y="180" width="180" height="30" fill="#ec4899" rx="4"/>
  <rect x="410" y="220" width="220" height="30" fill="#3b82f6" rx="4"/>
  <!-- Playhead line -->
  <line x1="500" y1="130" x2="500" y2="380" stroke="#f43f5e" stroke-width="4"/>
  <!-- Bottom Timeline Bar -->
  <rect x="150" y="320" width="500" height="60" fill="#1e293b" rx="6"/>
  <rect x="200" y="335" width="160" height="30" fill="#8b5cf6" rx="4"/>
  <rect x="380" y="335" width="220" height="30" fill="#06b6d4" rx="4"/>

  <text x="400" y="470" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="6">VFX &amp; EDITING</text>
</svg>
