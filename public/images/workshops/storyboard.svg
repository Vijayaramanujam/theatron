  <path d="M 385 155 L 415 155 L 405 145 M 415 155 L 405 165" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>

  <text x="400" y="470" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="6">STORYBOARD WORKSHOP</text>
