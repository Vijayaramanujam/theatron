<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#134e4a"/>
  <!-- Storyboard Frames Grid -->
  <rect x="140" y="80" width="230" height="150" fill="#0f766e" rx="8" stroke="#2dd4bf" stroke-width="6"/>
  <rect x="430" y="80" width="230" height="150" fill="#0f766e" rx="8" stroke="#2dd4bf" stroke-width="6"/>
  <rect x="140" y="260" width="230" height="150" fill="#0f766e" rx="8" stroke="#2dd4bf" stroke-width="6"/>
  <rect x="430" y="260" width="230" height="150" fill="#0f766e" rx="8" stroke="#2dd4bf" stroke-width="6"/>
  <!-- Shot labels -->
  <text x="255" y="165" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="22" fill="#ccfbf1" text-anchor="middle">SHOT 1: WIDE</text>
  <text x="545" y="165" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="22" fill="#ccfbf1" text-anchor="middle">SHOT 2: CLOSE-UP</text>
